seed: 0

# Values eval_jailbreakbench.sh passes for llada_instruct.
# steps / gen_length are NOT used by generate_llada (it only fills masks already in the prompt).
# mask_counts IS used: prompts without any mask (zeroshot) get 36 masks appended.
